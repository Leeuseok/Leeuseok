<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="HGSS inspired developer header">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8ecbff" />
      <stop offset="70%" stop-color="#dff5ff" />
      <stop offset="70%" stop-color="#9fd78b" />
      <stop offset="100%" stop-color="#77b164" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="0" flood-color="#456" flood-opacity="0.35" />
    </filter>
    <style>
      .pixel { shape-rendering: crispEdges; }
      .outline { stroke:#293645; stroke-width:6; }
      .title { font-family: 'Trebuchet MS', Verdana, sans-serif; font-weight: 900; }
      .small { font-family: monospace; font-weight: 700; }
    </style>
  </defs>
  <rect width="1200" height="360" fill="url(#sky)" />
  <!-- clouds -->
  <g opacity="0.8" class="pixel">
    <rect x="130" y="58" width="28" height="14" fill="#fff" />
    <rect x="158" y="44" width="56" height="28" fill="#fff" />
    <rect x="214" y="58" width="42" height="14" fill="#fff" />
    <rect x="930" y="72" width="28" height="14" fill="#fff" />
    <rect x="958" y="58" width="70" height="28" fill="#fff" />
    <rect x="1028" y="72" width="42" height="14" fill="#fff" />
  </g>
  <!-- grass tiles -->
  <g class="pixel">
    <rect y="254" width="1200" height="106" fill="#7bb55e" />
    <rect y="270" width="1200" height="20" fill="#6ca34f" />
    <rect y="310" width="1200" height="18" fill="#6ca34f" />
    <rect x="0" y="254" width="1200" height="8" fill="#a1d988" opacity="0.65" />
  </g>
  <!-- pixel shrubs -->
  <g class="pixel">
    <rect x="66" y="224" width="64" height="46" fill="#4f8740" />
    <rect x="86" y="206" width="24" height="18" fill="#4f8740" />
    <rect x="1030" y="224" width="82" height="46" fill="#4f8740" />
    <rect x="1060" y="206" width="24" height="18" fill="#4f8740" />
  </g>
  <!-- main card -->
  <g filter="url(#shadow)">
    <rect x="95" y="56" width="1010" height="230" rx="18" fill="#fff8e7" class="outline" />
    <rect x="118" y="78" width="964" height="48" rx="12" fill="#d2e5f9" class="outline" />
    <rect x="118" y="144" width="316" height="118" rx="12" fill="#fffefb" class="outline" />
    <rect x="455" y="144" width="627" height="118" rx="12" fill="#fffefb" class="outline" />
  </g>
  <!-- pixel adventure trainer: cap, jacket, backpack and partner ball -->
  <g transform="translate(182 149)" class="pixel">
    <!-- ground shadow -->
    <rect x="28" y="104" width="112" height="7" rx="3" fill="#c5cfda" />

    <!-- backpack and legs -->
    <rect x="36" y="48" width="26" height="48" rx="5" fill="#d9ad43" stroke="#293645" stroke-width="4" />
    <path d="M61 83h25l-3 22H65z" fill="#374b68" stroke="#293645" stroke-width="4" />
    <path d="M86 83h24l11 20-17 4-16-17z" fill="#435b7a" stroke="#293645" stroke-width="4" />
    <path d="M62 102h23v8H57zM103 101h23v9h-27z" fill="#e9edf2" stroke="#293645" stroke-width="4" />

    <!-- torso and jacket -->
    <path d="M58 47l24-8 27 10 4 40H56z" fill="#f5f7f9" stroke="#293645" stroke-width="4" />
    <path d="M58 47l15-5 9 47H56zM107 48l-15-6-10 47h31z" fill="#4d78a8" />
    <path d="M78 44h9v45h-9z" fill="#e9b949" />
    <rect x="61" y="61" width="14" height="5" fill="#d5e5f2" />
    <rect x="93" y="61" width="14" height="5" fill="#d5e5f2" />

    <!-- left arm -->
    <path d="M59 50L43 61l-10 25 12 4 15-23 12-7z" fill="#4d78a8" stroke="#293645" stroke-width="4" />
    <rect x="31" y="82" width="16" height="13" rx="5" fill="#f1bf98" stroke="#293645" stroke-width="4" />

    <!-- right arm presenting a ball -->
    <path d="M106 50l18 12 15 10-8 11-22-12-13-10z" fill="#4d78a8" stroke="#293645" stroke-width="4" />
    <rect x="130" y="70" width="14" height="14" rx="5" fill="#f1bf98" stroke="#293645" stroke-width="4" />
    <g transform="translate(153 74)">
      <circle r="13" fill="#fff" stroke="#293645" stroke-width="4" />
      <path d="M-13 0a13 13 0 0 1 26 0z" fill="#e85f55" />
      <path d="M-13 0h26" stroke="#293645" stroke-width="4" />
      <circle r="4" fill="#fff" stroke="#293645" stroke-width="3" />
    </g>

    <!-- face and hair -->
    <rect x="64" y="17" width="39" height="31" rx="8" fill="#f1bf98" stroke="#293645" stroke-width="4" />
    <path d="M62 22h10v-8h31v12l-8-5-5 8-7-7-8 8-13 1z" fill="#344156" />
    <rect x="70" y="29" width="5" height="6" fill="#293645" />
    <rect x="91" y="29" width="5" height="6" fill="#293645" />
    <path d="M78 40h11" stroke="#b85e55" stroke-width="3" />

    <!-- trainer cap and brim -->
    <path d="M58 17V9l12-8h26l12 9v9H65z" fill="#e85f55" stroke="#293645" stroke-width="4" />
    <path d="M81 2h15l12 8v3H81z" fill="#fff4de" />
    <rect x="52" y="15" width="34" height="7" rx="3" fill="#e85f55" stroke="#293645" stroke-width="4" />
  </g>
  <!-- Pokeball emblem -->
  <g transform="translate(1035 95)">
    <circle cx="0" cy="0" r="27" fill="#fff" stroke="#293645" stroke-width="5" />
    <path d="M-27 0 A27 27 0 0 1 27 0 Z" fill="#ef8d76" />
    <line x1="-27" y1="0" x2="27" y2="0" stroke="#293645" stroke-width="5" />
    <circle cx="0" cy="0" r="9" fill="#fff" stroke="#293645" stroke-width="5" />
  </g>
  <!-- text -->
  <text x="150" y="110" font-size="24" fill="#5a6d80" class="small">POKEMON HG / SS INSPIRED TRAINER PROFILE</text>
  <text x="470" y="184" font-size="54" fill="#2e3a4c" class="title">2RAIN_STONE</text>
  <text x="470" y="224" font-size="24" fill="#738394" class="title">WEB / MOBILE / BACKEND DEVELOPER</text>
  <text x="470" y="254" font-size="18" fill="#5e7280" class="small">Building with Next.js, Expo, APIs, and Python automation.</text>
  <!-- HG/SS bars -->
  <g>
    <rect x="470" y="92" width="170" height="18" rx="9" fill="#d9bf5b" stroke="#a88421" stroke-width="3" />
    <text x="492" y="106" font-size="12" fill="#62480a" class="small">HEARTGOLD MODE</text>
    <rect x="655" y="92" width="190" height="18" rx="9" fill="#d7dde5" stroke="#9098a6" stroke-width="3" />
    <text x="682" y="106" font-size="12" fill="#59606a" class="small">SOULSILVER MODE</text>
  </g>
  <text x="140" y="334" font-size="18" fill="#eff9ff" class="small">POKEGEAR: GitHub / Email / Instagram / Repositories</text>
</svg>
